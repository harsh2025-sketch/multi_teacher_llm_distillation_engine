# Production Configuration for Llama 3.2 + Gemma 2 Distillation
# Full-scale training with modern models

project_name: "llama_gemma_distillation"
output_dir: "./outputs/llama_gemma_production"
seed: 42
cache_dir: "./cache"

# Teacher models - modern LLMs with 8-bit quantization
teachers:
  - model_id: "meta-llama/Llama-3.2-3B-Instruct"
    weight: 0.6
    use_8bit: true
    use_4bit: false
    trust_remote_code: true
    device_map: "auto"
  
  - model_id: "google/gemma-2-2b-it"
    weight: 0.4
    use_8bit: true
    use_4bit: false
    trust_remote_code: true
    device_map: "auto"

# Dataset - large scale training
dataset:
  source_type: "huggingface"
  source_path: "HuggingFaceFW/fineweb-edu"
  config_name: "sample-10BT"
  split: "train"
  text_column: "text"
  max_samples: 100000  # 100K samples
  streaming: false

# Student model - ~250M parameters
student:
  vocab_size: 128256  # Llama 3 vocab size
  hidden_size: 768
  intermediate_size: 2048
  num_hidden_layers: 12
  num_attention_heads: 12
  num_key_value_heads: 12  # Standard attention
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: true

# Training - production settings
training:
  # Batch settings
  batch_size: 4
  num_epochs: 3
  max_length: 512
  gradient_accumulation_steps: 4  # Effective batch = 16
  
  # Optimization
  learning_rate: 5.0e-5
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-9
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  
  # Distillation
  temperature: 2.0
  alpha: 0.7
  
  # Mixed precision
  use_fp16: false
  use_bf16: true  # Better for A100/H100
  
  # Checkpointing
  save_steps: 500
  save_total_limit: 3
  logging_steps: 10
  
  # Hardware
  dataloader_num_workers: 4
  dataloader_pin_memory: true
